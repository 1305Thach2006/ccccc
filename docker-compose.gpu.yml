# File mở rộng (override) cho phép container Ollama dùng GPU rời NVIDIA.
# Yêu cầu: máy có card NVIDIA và đã cài NVIDIA Container Toolkit.
# Cách chạy:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
